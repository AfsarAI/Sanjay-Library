spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: super_secret_test_key_minimum_32_characters_long_for_hmac256
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  razorpay:
    key-id: rzp_test_mock
    key-secret: rzp_secret_mock
    webhook-secret: rzp_webhook_secret_mock
    currency: INR
