spring:
  application:
    name: digital-library-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_library}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres_secure_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 30000
      pool-name: LibraryHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

# Application Security and JWT configuration
app:
  jwt:
    secret: ${JWT_SECRET:super_secret_production_key_minimum_32_characters_long_for_hmac256}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000} # 30 days
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
    key-secret: ${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:rzp_webhook_secret_placeholder}
    currency: INR
  settings:
    default-monthly-fee: ${DEFAULT_MONTHLY_FEE:700.00}
    default-grace-days: ${DEFAULT_GRACE_PERIOD_DAYS:7}
    default-block-days: ${DEFAULT_ATTENDANCE_BLOCK_DAYS:8}
    default-release-days: ${DEFAULT_SEAT_RELEASE_DAYS:15}
    default-reservation-timeout-minutes: ${DEFAULT_RESERVATION_TIMEOUT_MINUTES:10}
  notifications:
    fcm:
      enabled: ${NOTIFICATIONS_FCM_ENABLED:false}
      server-key: ${FCM_SERVER_KEY:}
    email:
      enabled: ${NOTIFICATIONS_EMAIL_ENABLED:false}
      from: ${MAIL_FROM:noreply@sanjaylibrary.com}
    whatsapp:
      enabled: ${NOTIFICATIONS_WHATSAPP_ENABLED:false}
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v18.0}
      phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${WHATSAPP_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
