name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test-and-build:
    name: Backend Test & Build (Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digital_library_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Run Backend Unit/Integration Tests
        working-directory: ./backend
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: digital_library_test
          DB_USER: test_user
          DB_PASSWORD: test_password
          JWT_SECRET: ci_test_secret_key_minimum_32_characters_long_for_hmac256
        run: |
          mvn clean verify -B

  mobile-test-and-build:
    name: Mobile Test & Analyze (Flutter)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter Tests
        working-directory: ./mobile
        run: flutter test
