name: mobile
description: "Production-grade Digital Library Management Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking & HTTP
  dio: ^5.7.0

  # Navigation & Routing
  go_router: ^14.3.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Utilities & Localization
  intl: ^0.19.0
  google_fonts: ^6.2.1

  # QR Code Scanning for Attendance
  mobile_scanner: ^5.2.3

  # Icons
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
